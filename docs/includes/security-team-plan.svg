<title id="ld-security-team-plan-t">Team plan data exposure</title><desc id="ld-security-team-plan-d">The browser talks to LaminHub over HTTPS. LaminHub sends SQL queries to the Postgres metadata database in the customer infrastructure over an allowlisted connection and receives metadata results. Access to AWS S3 and Google Cloud Storage is optional. Local storage is not connected.</desc>
