<svg xmlns="http://www.w3.org/2000/svg" class="ld-diagram" viewBox="0 0 1045 369" width="1045" height="369" role="img" aria-labelledby="ld-security-team-plan-t ld-security-team-plan-d">
  <title id="ld-security-team-plan-t">LaminHub Team and customer-hosted LaminDB</title>
  <desc id="ld-security-team-plan-d">LaminHub returns HTTPS responses to browser, REST API and MCP clients. The customer’s Postgres returns SQL query results to LaminHub. On authorized managed S3 reads, object content can pass through LaminHub. Through service account impersonation, Google can return an access token for Cloud Storage to LaminHub. Inside customer infrastructure, database and storage reads return data directly to LaminDB. LaminHub can also return optional federated tokens to LaminDB for Postgres and cloud storage.</desc>
